# dsh-btw —— 组合包（bundle）自己的 patch 层。
#
# 作为 profile 依赖 link 进来后，profile 的 `dsh.profile.bundles` 里列出本包，
# 这一行由本文件声明；profile 自己的 cordis.patch.yml 不再 insert 同一个 id，
# 否则 applyEntryPatches 会把同一行插两次、加载两遍。
#
# 用户仍可在 profile patch 里按 `id: btw` 覆盖 config 或写 `disabled: true` 停用。
- insert:
    - id: btw
      name: dsh-btw
