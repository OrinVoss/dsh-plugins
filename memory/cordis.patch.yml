# dsh-memory —— 组合包（bundle）自己的 patch 层。
#
# 作为 profile 依赖安装后，profile 的 `dsh.profile.bundles` 里列出本包，
# 这一行由本文件声明；profile 自己的 cordis.patch.yml 不再 insert，
# 否则同一 id 会被插入两次（`applyEntryPatches` 只是 push，会加载两遍、
# 第二次注册同名工具会报 already registered）。
#
# 用户仍可在 profile patch 里按 `id: memory` 覆盖这里的 config 或 `disabled: true`。
- insert:
    - id: memory
      name: dsh-memory
      config:
        maxBlockBytes: 32768
        autoCommit: true
        # 工作区记忆区块：写进会话工作区自己的指令文件（DSH 会读 AGENTS.md / AGENTS.local.md）。
        # 默认 AGENTS.local.md —— 独立生效，且按惯例不进版本控制；想让它进仓库就改成 AGENTS.md。
        injectProjectBlock: true
        projectBlockFile: AGENTS.local.md
        maxProjectBlockBytes: 8192
        # L0 注入形态：layered = 规则速查 + 专题地图（默认，2026-10-09 起）；
        # full = 逐条摘要（旧行为，改这一行即可一键回滚）。
        blockMode: layered
        # L1 检索注入：每次用户轮次按消息内容检索记忆，只注入命中的几条（默认开）。
        # enabled:false 可单独关掉；k/minScore/maxBytes 调松紧；log:false 关掉注入日志。
        # 注意：本文件只在应用启动时读；这里的值只是"文档 + 覆盖"，默认值在代码里（改完即生效）。
        retrieve:
          enabled: true
          k: 3
          minScore: 8
          maxBytes: 2000
          # 去重：主触发器是「压缩事件」（压缩会把旧消息 shadow 掉，那时必须允许重送）。
          # clearOnCompaction=false 可关掉；repeatAfterSteps 只是兜底窗口（默认 60）。
          clearOnCompaction: true
          repeatAfterSteps: 60
        # 专题地图里每个分组的关键词提示（让模型知道该搜什么）
        sectionHints:
          本机与网络: 代理 10808 / 外网可达性 / 蓝屏 TDR / 内存显存预算 / 麦克风
          脚本与开发环境: PowerShell/GBK 编码 / VS 构建工具 / 安卓 / 端口排查 / C++ 控制台中文
          本机 AI 栈（llama.cpp / sd.cpp）: llama.cpp 调参 / CUDA / sd-server / Qwen 出图 / 模型基准与耗时
          交付物制作技巧: PPT / 网页与单文件 HTML / SVG / 绘本 / 出片与混音 / Blender / 图表 / 验收截图 / 推理题与跑批
          工具配置: DSH 插件与预设 / kimi-webbridge / kimi-cu / opencode / 沙箱边界 / 会话日志 / 自研仓库
        autoAgentsSync: true
        settingsPage: true
        syncOnStartup: true
