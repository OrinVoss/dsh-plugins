# dsh-pet —— 组合包（bundle）自己的 patch 层。
#
# 作为 profile 依赖安装后，profile 的 `dsh.profile.bundles` 里列出本包名，
# 这一行由本文件声明。不要在 profile 自己的 cordis.patch.yml 里再 insert 一次，
# 否则同一 id 会被插入两遍（applyEntryPatches 只做 push），插件会加载两次。
#
# 用户仍可在 profile patch 里按 `id: pet` 覆盖下面的 config 或 `disabled: true`。
- insert:
    - id: pet
      name: dsh-pet
